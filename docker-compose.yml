version: '3.8'

services:
  taxkernel-api:
    build: .
    container_name: taxkernel-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - taxkernel_db_data:/app/data
    environment:
      - REDIS_URL=redis://taxkernel-redis:6379/0
    depends_on:
      - taxkernel-redis
    restart: always

  taxkernel-redis:
    image: redis:7-alpine
    container_name: taxkernel-redis
    ports:
      - "6379:6379"
    restart: always

  taxkernel-worker:
    build: .
    container_name: taxkernel-worker
    command: python -m unittest test_production.py # Stand-in worker runner or testing loop
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://taxkernel-redis:6379/0
    depends_on:
      - taxkernel-redis
    restart: on-failure

volumes:
  taxkernel_db_data:
